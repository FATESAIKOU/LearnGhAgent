name: 00-root

# 職責：接受 issue，建新 project dir（harness 骨架 + workflow 範本）
# 觸發：issue opened + 手動
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number"
        required: true

concurrency:
  group: 00-root
  cancel-in-progress: false

jobs:
  create-project:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'root:create-project'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_MODEL: ollama-cloud/${{ vars.OLLAMA_DEFAULT_MODEL || 'deepseek-v4-flash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Resolve issue
        id: issue
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            issue_number="${{ github.event.inputs.issue_number }}"
          else
            issue_number="${{ github.event.issue.number }}"
          fi
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          # 取 issue title + body
          issue_json=$(gh issue view "$issue_number" --json title,body)
          echo "title=$(echo "$issue_json" | jq -r .title)" >> "$GITHUB_OUTPUT"
          echo "body=$(echo "$issue_json" | jq -r .body)" >> "$GITHUB_OUTPUT" >> "$GITHUB_ENV"

      - name: Generate project spec via opencode
        id: spec
        run: |
          set -uo pipefail
          ISSUE_TITLE="${{ steps.issue.outputs.title }}"
          ISSUE_BODY="${{ steps.issue.outputs.body }}"
          # 用 opencode 從 issue 內容解析 project name + description + role
          cat > /tmp/root_prompt.txt <<EOF
          你是一個 project 生成器。請從以下 issue 內容解析出 project 規格，產出 JSON：

          {
            "project_name": "<簡潔英文資料夾名，如 02-news-catchup>",
            "project_description": "<一句話描述這個 project 做什麼>",
            "project_role": "<agent 角色描述，如「你是新聞分析助理」>"
          }

          Issue title: ${ISSUE_TITLE}
          Issue body: ${ISSUE_BODY}

          只回傳 JSON，不要其他文字。
          EOF
          opencode run --model "$OPENCODE_MODEL" --title "root-spec" "$(cat /tmp/root_prompt.txt)" > /tmp/spec_raw.txt 2>&1 || true
          # 從輸出中抓 JSON
          spec=$(cat /tmp/spec_raw.txt | grep -E '^\{' | head -1)
          if [[ -z "$spec" ]]; then
            echo "FAIL: could not parse project spec from opencode output"
            cat /tmp/spec_raw.txt
            exit 1
          fi
          project_name=$(echo "$spec" | jq -r .project_name)
          project_desc=$(echo "$spec" | jq -r .project_description)
          project_role=$(echo "$spec" | jq -r .project_role)
          echo "project_name=$project_name" >> "$GITHUB_OUTPUT"
          echo "project_desc=$project_desc" >> "$GITHUB_OUTPUT"
          echo "project_role=$project_role" >> "$GITHUB_OUTPUT"
          echo "project: $project_name — $project_desc"

      - name: Create project from template
        run: |
          set -euo pipefail
          project_name="${{ steps.spec.outputs.project_name }}"
          project_desc="${{ steps.spec.outputs.project_desc }}"
          project_role="${{ steps.spec.outputs.project_role }}"
          target="projects/${project_name}"

          # 已存在就跳過
          if [[ -d "$target" ]]; then
            echo "Project $project_name already exists, skip"
            exit 0
          fi

          # 複製範本
          cp -r .github/project-template "$target"
          chmod +x "$target/validate.sh"

          # 填入 AGENTS.md placeholder
          sed -i "s|{{PROJECT_NAME}}|$project_name|g" "$target/know/AGENTS.md"
          sed -i "s|{{PROJECT_DESCRIPTION}}|$project_desc|g" "$target/know/AGENTS.md"
          sed -i "s|{{PROJECT_ROLE}}|$project_role|g" "$target/know/AGENTS.md"

          # 建 project workflow（從 01-general-tech.yml 複製，改 project name + label）
          sed "s|01-general-tech|$project_name|g" .github/workflows/01-general-tech.yml > ".github/workflows/${project_name}.yml"

          # commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target" ".github/workflows/${project_name}.yml"
          git commit -m "Create project: $project_name — $project_desc"
          git push

          echo "Project $project_name created and pushed to main"

      - name: Comment on issue
        run: |
          issue_number="${{ steps.issue.outputs.number }}"
          project_name="${{ steps.spec.outputs.project_name }}"
          gh issue comment "$issue_number" --body "✅ Project \`${project_name}\` 已建立。請用 label \`project:${project_name}\` 開新 issue 來執行任務。"