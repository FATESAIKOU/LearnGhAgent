name: 01-general-tech

# 觸發條件：
# 1. workflow_dispatch (input: pr_number) — 手動觸發
# 2. pull_request opened — PR 一建立就自動執行（與 create-pr 接力）
# 3. issue_comment on PR — user 在 PR 留言觸發接續工作
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to execute"
        required: true
      max_retry:
        description: "Max retry attempts per step"
        required: false
        default: "3"
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  # ============================================================
  # Job 1: guard — 判 PR number + label，輸出 skip + pr_number
  # ============================================================
  guard:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Resolve PR number + check label
        id: check
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pr_number="${{ github.event.inputs.pr_number }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
          else
            pr_number="${{ github.event.issue.number }}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          labels=$(gh pr view "$pr_number" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          if echo "$labels" | grep -q '^project:01-general-tech$'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # Job 2: execute — 只在 guard 通過時跑
  # ============================================================
  execute:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_MODEL: ollama-cloud/${{ vars.OLLAMA_DEFAULT_MODEL || 'deepseek-v4-flash' }}
      PROJECT_DIR: projects/01-general-tech
      MAX_RETRY: ${{ github.event.inputs.max_retry || '3' }}
      CHATLOG: ../../.github/scripts/chatlog.py
      PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
    defaults:
      run:
        working-directory: projects/01-general-tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install opencode
        working-directory: .
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Switch to PR branch + build context + round id + paths
        id: ctx
        run: |
          set -euo pipefail
          pr_branch=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName 2>/dev/null || echo "")
          if [[ -n "$pr_branch" ]]; then
            git fetch origin "$pr_branch"
            git checkout "$pr_branch"
          fi
          mkdir -p memory/log output
          gh pr view "$PR_NUMBER" --json body,comments > /tmp/pr_data.json
          python3 "$CHATLOG" /tmp/chatlog.json load-context-from-pr-log < /tmp/pr_data.json > /tmp/load_output.txt 2>&1
          cat /tmp/load_output.txt
          round_line=$(grep -oE 'current round R[0-9]+' /tmp/load_output.txt | grep -oE 'R[0-9]+')
          echo "ROUND_ID=$round_line" >> "$GITHUB_ENV"
          python3 "$CHATLOG" /tmp/chatlog.json toprompt > /tmp/conversation_context.txt
          echo "STEP1_LOG=memory/log/${PR_NUMBER}_${round_line}_step1-intent.md" >> "$GITHUB_ENV"
          echo "STEP2_LOG=memory/log/${PR_NUMBER}_${round_line}_step2-plan_C1.md" >> "$GITHUB_ENV"
          echo "STEP3_LOG=memory/log/${PR_NUMBER}_${round_line}_step3-qa.md" >> "$GITHUB_ENV"
          echo "STEP4_LOG=memory/log/${PR_NUMBER}_${round_line}_step4-summary.md" >> "$GITHUB_ENV"
          echo "context built: $(wc -c < /tmp/conversation_context.txt) chars, round=$round_line"

      # ============================================================
      # Step 1: 意圖理解
      # ============================================================
      - name: Step 1 - Build prompt (main + review)
        run: |
          REVIEW_FILE="memory/log/${PR_NUMBER}_${ROUND_ID}_review_step1.md"
          echo "STEP1_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 1：意圖理解。"
            echo "請依 know/AGENTS.md 中 Step 1 的規定，產出 ${STEP1_LOG}。"
            echo "這是「你自己的動作總結」。格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "注意：你要理解的是「這一輪（${ROUND_ID}）使用者的意圖」。若這是 R2+，使用者可能在追問、質疑或要求補充前幾輪的內容。"
            echo "直接把檔案內容寫到 ${STEP1_LOG}，不要額外輸出說明文字。"
          } > /tmp/step1_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 1 的軟性驗證。"
            echo "請讀取 judge/step1-intent.md 取得 review 觀點，再讀取 ${STEP1_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step1_review_prompt.txt

      - name: Step 1 - Attempt 1
        id: step1_a1
        if: always()
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step1_prompt.txt
          review-prompt-file: /tmp/step1_review_prompt.txt
          out-file: ${{ env.STEP1_LOG }}
          review-file: ${{ env.STEP1_REVIEW }}
          validate-type: step-log-short
          step-name: step1-a1

      - name: Step 1 - Attempt 2
        id: step1_a2
        if: ${{ steps.step1_a1.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 2 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step1_prompt.txt
          review-prompt-file: /tmp/step1_review_prompt.txt
          out-file: ${{ env.STEP1_LOG }}
          review-file: ${{ env.STEP1_REVIEW }}
          validate-type: step-log-short
          step-name: step1-a2

      - name: Step 1 - Attempt 3
        id: step1_a3
        if: ${{ steps.step1_a2.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 3 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step1_prompt.txt
          review-prompt-file: /tmp/step1_review_prompt.txt
          out-file: ${{ env.STEP1_LOG }}
          review-file: ${{ env.STEP1_REVIEW }}
          validate-type: step-log-short
          step-name: step1-a3

      - name: Step 1 - Attempt 4
        id: step1_a4
        if: ${{ steps.step1_a3.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 4 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step1_prompt.txt
          review-prompt-file: /tmp/step1_review_prompt.txt
          out-file: ${{ env.STEP1_LOG }}
          review-file: ${{ env.STEP1_REVIEW }}
          validate-type: step-log-short
          step-name: step1-a4

      - name: Step 1 - Attempt 5
        id: step1_a5
        if: ${{ steps.step1_a4.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 5 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step1_prompt.txt
          review-prompt-file: /tmp/step1_review_prompt.txt
          out-file: ${{ env.STEP1_LOG }}
          review-file: ${{ env.STEP1_REVIEW }}
          validate-type: step-log-short
          step-name: step1-a5

      - name: Step 1 - Fail check
        if: ${{ steps.step1_a1.outputs.pass != 'true' && steps.step1_a2.outputs.pass != 'true' && steps.step1_a3.outputs.pass != 'true' && steps.step1_a4.outputs.pass != 'true' && steps.step1_a5.outputs.pass != 'true' }}
        run: |
          echo "Step 1 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Step 2: 執行計劃 (C1)
      # ============================================================
      - name: Step 2 - Build prompt (main + review)
        run: |
          REVIEW_FILE="memory/log/${PR_NUMBER}_${ROUND_ID}_review_step2.md"
          echo "STEP2_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 2 的第一個 sub-step C1：取得 repo metadata 與主要文件。"
            echo "請依 do/skills/document/SKILL.md 的標準調研動作執行："
            echo "1. 若是 GitHub repo，用 gh api / gh repo view 取得 metadata"
            echo "2. 擷取 README.md 與關鍵子文件"
            echo "3. 補查背景脈絡"
            echo "若是 R2+，請針對這輪的意圖執行調研，而非重新做 R1 的事。"
            echo "產出 ${STEP2_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "直接把檔案內容寫到 ${STEP2_LOG}。"
          } > /tmp/step2_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 2 的軟性驗證。"
            echo "請讀取 judge/step2-plan.md 取得 review 觀點，再讀取 ${STEP2_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step2_review_prompt.txt

      - name: Step 2 - Attempt 1
        id: step2_a1
        if: always()
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step2_prompt.txt
          review-prompt-file: /tmp/step2_review_prompt.txt
          out-file: ${{ env.STEP2_LOG }}
          review-file: ${{ env.STEP2_REVIEW }}
          validate-type: step-log-long
          step-name: step2-a1

      - name: Step 2 - Attempt 2
        id: step2_a2
        if: ${{ steps.step2_a1.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 2 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step2_prompt.txt
          review-prompt-file: /tmp/step2_review_prompt.txt
          out-file: ${{ env.STEP2_LOG }}
          review-file: ${{ env.STEP2_REVIEW }}
          validate-type: step-log-long
          step-name: step2-a2

      - name: Step 2 - Attempt 3
        id: step2_a3
        if: ${{ steps.step2_a2.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 3 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step2_prompt.txt
          review-prompt-file: /tmp/step2_review_prompt.txt
          out-file: ${{ env.STEP2_LOG }}
          review-file: ${{ env.STEP2_REVIEW }}
          validate-type: step-log-long
          step-name: step2-a3

      - name: Step 2 - Attempt 4
        id: step2_a4
        if: ${{ steps.step2_a3.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 4 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step2_prompt.txt
          review-prompt-file: /tmp/step2_review_prompt.txt
          out-file: ${{ env.STEP2_LOG }}
          review-file: ${{ env.STEP2_REVIEW }}
          validate-type: step-log-long
          step-name: step2-a4

      - name: Step 2 - Attempt 5
        id: step2_a5
        if: ${{ steps.step2_a4.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 5 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step2_prompt.txt
          review-prompt-file: /tmp/step2_review_prompt.txt
          out-file: ${{ env.STEP2_LOG }}
          review-file: ${{ env.STEP2_REVIEW }}
          validate-type: step-log-long
          step-name: step2-a5

      - name: Step 2 - Fail check
        if: ${{ steps.step2_a1.outputs.pass != 'true' && steps.step2_a2.outputs.pass != 'true' && steps.step2_a3.outputs.pass != 'true' && steps.step2_a4.outputs.pass != 'true' && steps.step2_a5.outputs.pass != 'true' }}
        run: |
          echo "Step 2 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Step 3: 品質保證 (產報告 + 軟性驗證)
      # ============================================================
      - name: Step 3 - Build prompt (report + review)
        run: |
          current_round_num="${ROUND_ID#R}"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 3：基於調研資料，產出/更新最終分析報告。"
            if (( current_round_num == 1 )); then
              echo "這是 R1，請新建分析報告。檔名格式：output/${PR_NUMBER}_<技術名>.md"
              echo "（<技術名> 由你從調研標的自行判斷決定，用簡潔英文）"
              echo "報告必須含 4 個必要 section（首次產出無 ## 5. User Q&A）："
              echo "## 1. 這個技術解決什麼問題？ / ## 2. 這個問題為什麼會發生？（背景） / ## 3. 這個技術是如何解決該問題的？ / ## 4. 是否存在解決類似問題的其他技術 / 框架 / 思考方式？"
              echo "詳細格式見 know/AGENTS.md「分析報告格式」。直接把檔案內容寫到 output/ 目錄。"
            else
              echo "這是 ${ROUND_ID}（R2+），使用者正在追問前幾輪的內容。"
              echo "請讀取既有報告（output/ 目錄中 ${PR_NUMBER}_*.md 的檔案），把這一輪的 QA 沉澱進報告的 ## 5. User Q&A 章節："
              echo "- 將這一輪使用者提問構造化為 QA 條目，追加進 ## 5. User Q&A"
              echo "- 既有 QA 不可刪改，新 QA 按序號遞增接續"
              echo "- 若需補充 §1-§4 的內容也可更新，但不要刪除既有內容"
              echo "- 報告檔名保持不變（沿用 R1 的檔名）"
              echo "詳細格式見 know/AGENTS.md「分析報告格式」的 §5 規則。直接更新既有報告檔案。"
            fi
          } > /tmp/step3_report_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 3 的軟性驗證。"
            echo "請讀取 judge/step3-qa.md 取得 review 觀點，再讀取產出的分析報告（output/ 目錄中 ${PR_NUMBER}_*.md），依觀點做評估。"
            echo "產出 ${STEP3_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${STEP3_LOG}。"
          } > /tmp/step3_review_prompt.txt

      - name: Step 3 - Attempt 1 (report + review, retry loop)
        id: step3_a1
        if: always()
        run: |
          set -euo pipefail
          current_round_num="${ROUND_ID#R}"
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 3 attempt $attempt/$MAX_RETRY ---"
            rm -f "${STEP3_LOG}"
            if (( current_round_num == 1 )); then
              rm -f output/${PR_NUMBER}_*.md
            fi
            opencode run --model "$OPENCODE_MODEL" --title "step3-report-$attempt" "$(cat /tmp/step3_report_prompt.txt)" || echo "report run failed (will validate)"
            report_file=$(ls output/${PR_NUMBER}_*.md 2>/dev/null | head -1)
            if [[ -z "$report_file" ]]; then
              echo "hard validate failed (no report file), retry"
              continue
            fi
            if ! ./validate.sh report "$report_file"; then
              echo "report hard validate failed, retry"
              continue
            fi
            echo "report hard validate passed"
            opencode run --model "$OPENCODE_MODEL" --title "step3-review-$attempt" "$(cat /tmp/step3_review_prompt.txt)" || echo "review run failed"
            if ! ./validate.sh step-log-medium "${STEP3_LOG}"; then
              echo "step3 log hard validate failed, retry"
              continue
            fi
            if ! grep -q "VERDICT: PASS" "${STEP3_LOG}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi
            echo "soft validate passed"
            echo "pass=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "pass=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Step 3 - Resolve report file
        if: steps.step3_a1.outputs.pass == 'true'
        run: |
          report_file=$(ls output/${PR_NUMBER}_*.md 2>/dev/null | head -1)
          echo "REPORT_FILE=$report_file" >> "$GITHUB_ENV"

      # ============================================================
      # Step 4: 總結
      # ============================================================
      - name: Step 4 - Build prompt (main + review)
        run: |
          REVIEW_FILE="memory/log/${PR_NUMBER}_${ROUND_ID}_review_step4.md"
          echo "STEP4_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 3 的 execution log ==="
            cat ${STEP3_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 3 log ==="
            echo ""
            echo "本輪產出的分析報告：${REPORT_FILE}"
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 4：總結本輪產出。"
            echo "產出 ${STEP4_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "在「動作結束後的現狀」中必須包含：本輪所有產出檔案清單（report + 各 step log）與待追問方向（若無則寫「無」）。"
            echo "直接把檔案內容寫到 ${STEP4_LOG}。"
          } > /tmp/step4_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 4 的軟性驗證。"
            echo "請讀取 judge/step4-summary.md 取得 review 觀點，再讀取 ${STEP4_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step4_review_prompt.txt

      - name: Step 4 - Attempt 1
        id: step4_a1
        if: always()
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step4_prompt.txt
          review-prompt-file: /tmp/step4_review_prompt.txt
          out-file: ${{ env.STEP4_LOG }}
          review-file: ${{ env.STEP4_REVIEW }}
          validate-type: step-log-short
          step-name: step4-a1

      - name: Step 4 - Attempt 2
        id: step4_a2
        if: ${{ steps.step4_a1.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 2 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step4_prompt.txt
          review-prompt-file: /tmp/step4_review_prompt.txt
          out-file: ${{ env.STEP4_LOG }}
          review-file: ${{ env.STEP4_REVIEW }}
          validate-type: step-log-short
          step-name: step4-a2

      - name: Step 4 - Attempt 3
        id: step4_a3
        if: ${{ steps.step4_a2.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 3 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step4_prompt.txt
          review-prompt-file: /tmp/step4_review_prompt.txt
          out-file: ${{ env.STEP4_LOG }}
          review-file: ${{ env.STEP4_REVIEW }}
          validate-type: step-log-short
          step-name: step4-a3

      - name: Step 4 - Attempt 4
        id: step4_a4
        if: ${{ steps.step4_a3.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 4 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step4_prompt.txt
          review-prompt-file: /tmp/step4_review_prompt.txt
          out-file: ${{ env.STEP4_LOG }}
          review-file: ${{ env.STEP4_REVIEW }}
          validate-type: step-log-short
          step-name: step4-a4

      - name: Step 4 - Attempt 5
        id: step4_a5
        if: ${{ steps.step4_a4.outputs.pass != 'true' && fromJSON(env.MAX_RETRY) >= 5 }}
        uses: ./.github/actions/run-step-attempt
        with:
          main-prompt-file: /tmp/step4_prompt.txt
          review-prompt-file: /tmp/step4_review_prompt.txt
          out-file: ${{ env.STEP4_LOG }}
          review-file: ${{ env.STEP4_REVIEW }}
          validate-type: step-log-short
          step-name: step4-a5

      - name: Step 4 - Fail check
        if: ${{ steps.step4_a1.outputs.pass != 'true' && steps.step4_a2.outputs.pass != 'true' && steps.step4_a3.outputs.pass != 'true' && steps.step4_a4.outputs.pass != 'true' && steps.step4_a5.outputs.pass != 'true' }}
        run: |
          echo "Step 4 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Final: Commit + Post logs to PR chat
      # ============================================================
      - name: Commit & push
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/01-general-tech/memory projects/01-general-tech/output
          git commit -m "tech-analysis: PR #${PR_NUMBER} ${ROUND_ID}" || echo "nothing to commit"
          git push

      - name: Post logs to PR chat (in order)
        run: |
          set -euo pipefail
          post_log() {
            local label="$1"
            local file="$2"
            local tag="$3"
            if [[ ! -f "$file" ]]; then
              echo "skip: $file not found"
              return
            fi
            local content
            content="$(cat "$file")"
            local prefix=""
            if [[ -n "$tag" ]]; then
              prefix="<!-- chatlog:${tag} -->\n"
            fi
            local max=60000
            if (( ${#content} <= max )); then
              gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$content")"
            else
              local idx=1
              while (( ${#content} > 0 )); do
                local chunk="${content:0:$max}"
                content="${content:$max}"
                gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s part %d]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$idx" "$chunk")"
                idx=$((idx+1))
              done
            fi
          }
          post_log "Step 1 - 意圖理解" "$STEP1_LOG" ""
          post_log "Step 2 - 執行計劃 C1" "$STEP2_LOG" ""
          post_log "Step 3 - 品質保證" "$STEP3_LOG" ""
          post_log "Step 4 - 總結" "$STEP4_LOG" "summary:${ROUND_ID}"
          post_log "分析報告" "$REPORT_FILE" ""