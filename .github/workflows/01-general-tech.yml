name: 01-general-tech

# 觸發條件：
# 1. workflow_dispatch (input: pr_number) — 手動觸發
# 2. pull_request opened — PR 一建立就自動執行（與 create-pr 接力）
# 3. issue_comment on PR — user 在 PR 留言觸發接續工作
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to execute"
        required: true
      max_retry:
        description: "Max retry attempts per step (1-5)"
        required: false
        default: "3"
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  # ============================================================
  # Job 1: guard
  # ============================================================
  guard:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      skip: ${{ steps.final.outputs.skip }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve PR number
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pr_number="${{ github.event.inputs.pr_number }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
          else
            pr_number="${{ github.event.issue.number }}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Check 1 — token exists
        id: check_token
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.OLLAMA_API_KEY }}" ]]; then
            echo "FAIL: OLLAMA_API_KEY secret is empty"
            echo "fail=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: token exists"
            echo "fail=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check 2 — last comment is user (or only body)
        id: check_last
        if: steps.check_token.outputs.fail != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.resolve.outputs.pr_number }}"
          # pull_request opened 事件 = 只有 body，算 pass
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "OK: pull_request opened (only body)"
            echo "fail=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # workflow_dispatch = 手動觸發，直接 pass（由 caller 負責判斷）
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "OK: workflow_dispatch (manual trigger)"
            echo "fail=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # issue_comment 事件：檢查最後一則非 bot comment 是否為 user
          # 觸發此 workflow 的 comment 本身就是 user 的（if 條件已過濾 bot）
          # 但要確認「最後一則 comment 確實是 user 的」（而非 user 留完後 bot 又回了）
          json=$(gh pr view "$pr_number" --json comments)
          last_author=$(echo "$json" | jq -r '.comments[-1].author.login // empty')
          if [[ -z "$last_author" ]]; then
            echo "FAIL: no comments on PR"
            echo "fail=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$last_author" == *"bot"* ]] || [[ "$last_author" == "github-actions"* ]] || [[ "$last_author" == "app/"* ]] || [[ "$last_author" == *"[bot]"* ]]; then
            echo "FAIL: last comment is from bot ($last_author), not user"
            echo "fail=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: last comment is from user ($last_author)"
            echo "fail=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check 3 — PR has correct label
        id: check_label
        if: steps.check_token.outputs.fail != 'true' && steps.check_last.outputs.fail != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.resolve.outputs.pr_number }}"
          labels=$(gh pr view "$pr_number" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          if echo "$labels" | grep -q '^project:01-general-tech$'; then
            echo "OK: has project:01-general-tech label"
            echo "fail=false" >> "$GITHUB_OUTPUT"
          else
            echo "FAIL: missing project:01-general-tech label"
            echo "fail=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggregate — final skip decision
        id: final
        if: always()
        run: |
          token_fail="${{ steps.check_token.outputs.fail }}"
          last_fail="${{ steps.check_last.outputs.fail }}"
          label_fail="${{ steps.check_label.outputs.fail }}"
          echo "token_fail=$token_fail last_fail=$last_fail label_fail=$label_fail"
          if [[ "$token_fail" == "true" || "$last_fail" == "true" || "$label_fail" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # Job 2: execute
  # ============================================================
  execute:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_MODEL: ollama-cloud/${{ vars.OLLAMA_DEFAULT_MODEL || 'deepseek-v4-flash' }}
      PROJECT_DIR: projects/01-general-tech
      MAX_RETRY: ${{ github.event.inputs.max_retry || '3' }}
      CHATLOG: ../../.github/scripts/chatlog.py
      PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
    defaults:
      run:
        working-directory: projects/01-general-tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install opencode
        working-directory: .
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Switch to PR branch + build context + round id + paths
        run: |
          set -euo pipefail
          pr_branch=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName 2>/dev/null || echo "")
          if [[ -n "$pr_branch" ]]; then
            git fetch origin "$pr_branch"
            git checkout "$pr_branch"
          fi
          mkdir -p memory/log output
          gh pr view "$PR_NUMBER" --json body,comments > /tmp/pr_data.json
          python3 "$CHATLOG" /tmp/chatlog.json load-context-from-pr-log < /tmp/pr_data.json > /tmp/load_output.txt 2>&1
          cat /tmp/load_output.txt
          round_line=$(grep -oE 'current round R[0-9]+' /tmp/load_output.txt | grep -oE 'R[0-9]+')
          echo "ROUND_ID=$round_line" >> "$GITHUB_ENV"
          python3 "$CHATLOG" /tmp/chatlog.json toprompt > /tmp/conversation_context.txt
          echo "STEP1_LOG=memory/log/${PR_NUMBER}_${round_line}_step1-intent.md" >> "$GITHUB_ENV"
          echo "STEP2_LOG=memory/log/${PR_NUMBER}_${round_line}_step2-plan_C1.md" >> "$GITHUB_ENV"
          echo "STEP3_LOG=memory/log/${PR_NUMBER}_${round_line}_step3-qa.md" >> "$GITHUB_ENV"
          echo "STEP4_LOG=memory/log/${PR_NUMBER}_${round_line}_step4-summary.md" >> "$GITHUB_ENV"
          echo "context built: $(wc -c < /tmp/conversation_context.txt) chars, round=$round_line"

      # ============================================================
      # Step 1: 意圖理解
      # ============================================================
      - name: Step 1 - Build prompt
        run: |
          REVIEW_FILE="memory/log/${PR_NUMBER}_${ROUND_ID}_review_step1.md"
          echo "STEP1_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 1：意圖理解。"
            echo "請依 know/AGENTS.md 中 Step 1 的規定，產出 ${STEP1_LOG}。"
            echo "這是「你自己的動作總結」。格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "注意：你要理解的是「這一輪（${ROUND_ID}）使用者的意圖」。若這是 R2+，使用者可能在追問、質疑或要求補充前幾輪的內容。"
            echo "檔案長度上限：2000 字。超過會被硬性驗證拒絕，請精簡。"
            echo "直接把檔案內容寫到 ${STEP1_LOG}，不要額外輸出說明文字。"
          } > /tmp/step1_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 1 的軟性驗證。"
            echo "請讀取 judge/step1-intent.md 取得 review 觀點，再讀取 ${STEP1_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step1_review_prompt.txt

      - name: Step 1 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 1 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP1_LOG}" "${STEP1_REVIEW}"
            opencode run --model "$OPENCODE_MODEL" --title "step1-$attempt" "$(cat /tmp/step1_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"

            echo "::group::Step 1 - Hard validate"
            ./validate.sh step-log-short "${STEP1_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed, retry"
              continue
            fi

            echo "::group::Step 1 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step1-review-$attempt" "$(cat /tmp/step1_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP1_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi

            echo "Step 1 passed on attempt $attempt"
            exit 0
          done
          echo "Step 1 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Step 2: 執行計劃 (C1)
      # ============================================================
      - name: Step 2 - Build prompt
        run: |
          REVIEW_FILE="memory/log/${PR_NUMBER}_${ROUND_ID}_review_step2.md"
          echo "STEP2_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 2 的第一個 sub-step C1：取得 repo metadata 與主要文件。"
            echo "請依 do/skills/document/SKILL.md 的標準調研動作執行："
            echo "1. 若是 GitHub repo，用 gh api / gh repo view 取得 metadata"
            echo "2. 擷取 README.md 與關鍵子文件"
            echo "3. 補查背景脈絡"
            echo "若是 R2+，請針對這輪的意圖執行調研，而非重新做 R1 的事。"
            echo "產出 ${STEP2_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "檔案長度上限：6000 字。超過會被硬性驗證拒絕，請精簡。"
            echo "直接把檔案內容寫到 ${STEP2_LOG}。"
          } > /tmp/step2_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 2 的軟性驗證。"
            echo "請讀取 judge/step2-plan.md 取得 review 觀點，再讀取 ${STEP2_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step2_review_prompt.txt

      - name: Step 2 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 2 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP2_LOG}" "${STEP2_REVIEW}"
            opencode run --model "$OPENCODE_MODEL" --title "step2-$attempt" "$(cat /tmp/step2_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"

            echo "::group::Step 2 - Hard validate"
            ./validate.sh step-log-long "${STEP2_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed, retry"
              continue
            fi

            echo "::group::Step 2 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step2-review-$attempt" "$(cat /tmp/step2_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP2_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi

            echo "Step 2 passed on attempt $attempt"
            exit 0
          done
          echo "Step 2 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Step 3: 品質保證 (產報告 + 軟性驗證)
      # ============================================================
      - name: Step 3 - Build prompt
        run: |
          current_round_num="${ROUND_ID#R}"
          REVIEW_FILE="memory/log/${PR_NUMBER}_${ROUND_ID}_review_step3.md"
          echo "STEP3_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          # 調研 prompt（同時產 report + step3-qa.md）
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 3：基於調研資料，產出/更新最終分析報告，並產出本 step 的 execution log。"
            echo "你需要產出兩個檔案："
            echo ""
            echo "1. 分析報告："
            if (( current_round_num == 1 )); then
              echo "   檔名格式：output/${PR_NUMBER}_<技術名>.md（<技術名> 由你從調研標的自行判斷決定，用簡潔英文）"
              echo "   報告必須含 4 個必要 section（首次產出無 ## 5. User Q&A）："
              echo "   ## 1. 這個技術解決什麼問題？ / ## 2. 這個問題為什麼會發生？（背景） / ## 3. 這個技術是如何解決該問題的？ / ## 4. 是否存在解決類似問題的其他技術 / 框架 / 思考方式？"
              echo "   詳細格式見 know/AGENTS.md「分析報告格式」。"
            echo "   報告長度上限：50000 字。超過會被硬性驗證拒絕。"
            else
              echo "   這是 ${ROUND_ID}（R2+），使用者正在追問前幾輪的內容。"
              echo "   請讀取既有報告（output/ 目錄中 ${PR_NUMBER}_*.md 的檔案），把這一輪的 QA 沉澱進報告的 ## 5. User Q&A 章節："
              echo "   - 將這一輪使用者提問構造化為 QA 條目，追加進 ## 5. User Q&A"
              echo "   - 既有 QA 不可刪改，新 QA 按序號遞增接續"
              echo "   - 若需補充 §1-§4 的內容也可更新，但不要刪除既有內容"
              echo "   - 報告檔名保持不變（沿用 R1 的檔名）"
              echo "   詳細格式見 know/AGENTS.md「分析報告格式」的 §5 規則。"
              echo "   報告總長度上限：50000 字（含既有內容）。超過會被硬性驗證拒絕。"
            fi
            echo ""
            echo "2. 本 step 的 execution log：${STEP3_LOG}"
            echo "   這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "   ## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "   在「動作結束後的現狀」中必須包含：產出的報告檔名與本輪變更摘要。"
            echo "   execution log 長度上限：3000 字。超過會被硬性驗證拒絕，請精簡。"
            echo ""
            echo "直接把兩個檔案內容分別寫到對應路徑。"
          } > /tmp/step3_main_prompt.txt
          # review prompt（產出可揮發 review 報告，跟其他 step 一致）
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 3 的軟性驗證。"
            echo "請讀取 judge/step3-qa.md 取得 review 觀點，再讀取產出的分析報告（output/ 目錄中 ${PR_NUMBER}_*.md），依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step3_review_prompt.txt

      - name: Step 3 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          current_round_num="${ROUND_ID#R}"
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 3 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP3_LOG}" "${STEP3_REVIEW}"
            if (( current_round_num == 1 )); then
              rm -f output/${PR_NUMBER}_*.md
            fi
            opencode run --model "$OPENCODE_MODEL" --title "step3-$attempt" "$(cat /tmp/step3_main_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"

            echo "::group::Step 3 - Hard validate (report)"
            report_file=$(ls output/${PR_NUMBER}_*.md 2>/dev/null | head -1)
            if [[ -n "$report_file" ]]; then
              ./validate.sh report "$report_file"
            fi
            hard_rc=$?
            echo "::endgroup::"
            if [[ -z "$report_file" || $hard_rc -ne 0 ]]; then
              echo "hard validate failed (report), retry"
              continue
            fi

            echo "::group::Step 3 - Hard validate (step log)"
            ./validate.sh step-log-medium "${STEP3_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed (step log), retry"
              continue
            fi

            echo "::group::Step 3 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step3-review-$attempt" "$(cat /tmp/step3_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP3_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi

            echo "REPORT_FILE=$report_file" >> "$GITHUB_ENV"
            echo "Step 3 passed on attempt $attempt"
            exit 0
          done
          echo "Step 3 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Step 4: 總結
      # ============================================================
      - name: Step 4 - Build prompt
        run: |
          REVIEW_FILE="memory/log/${PR_NUMBER}_${ROUND_ID}_review_step4.md"
          echo "STEP4_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 3 的 execution log ==="
            cat ${STEP3_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 3 log ==="
            echo ""
            echo "本輪產出的分析報告：${REPORT_FILE}"
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 4：總結本輪產出。"
            echo "產出 ${STEP4_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "在「動作結束後的現狀」中必須包含：本輪所有產出檔案清單（report + 各 step log）與待追問方向（若無則寫「無」）。"
            echo "檔案長度上限：2000 字。超過會被硬性驗證拒絕，請精簡。"
            echo "直接把檔案內容寫到 ${STEP4_LOG}。"
          } > /tmp/step4_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 4 的軟性驗證。"
            echo "請讀取 judge/step4-summary.md 取得 review 觀點，再讀取 ${STEP4_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step4_review_prompt.txt

      - name: Step 4 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 4 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP4_LOG}" "${STEP4_REVIEW}"
            opencode run --model "$OPENCODE_MODEL" --title "step4-$attempt" "$(cat /tmp/step4_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"

            echo "::group::Step 4 - Hard validate"
            ./validate.sh step-log-short "${STEP4_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed, retry"
              continue
            fi

            echo "::group::Step 4 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step4-review-$attempt" "$(cat /tmp/step4_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP4_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi

            echo "Step 4 passed on attempt $attempt"
            exit 0
          done
          echo "Step 4 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Final: Commit + Post logs to PR chat
      # ============================================================
      - name: Commit & push
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/01-general-tech/memory projects/01-general-tech/output
          git commit -m "tech-analysis: PR #${PR_NUMBER} ${ROUND_ID}" || echo "nothing to commit"
          git push

      - name: Post logs to PR chat (in order)
        run: |
          set -euo pipefail
          post_log() {
            local label="$1"
            local file="$2"
            local tag="$3"
            if [[ ! -f "$file" ]]; then
              echo "skip: $file not found"
              return
            fi
            local content
            content="$(cat "$file")"
            local prefix=""
            if [[ -n "$tag" ]]; then
              prefix="<!-- chatlog:${tag} -->\n"
            fi
            local max=60000
            if (( ${#content} <= max )); then
              gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$content")"
            else
              local idx=1
              while (( ${#content} > 0 )); do
                local chunk="${content:0:$max}"
                content="${content:$max}"
                gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s part %d]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$idx" "$chunk")"
                idx=$((idx+1))
              done
            fi
          }
          post_log "Step 1 - 意圖理解" "$STEP1_LOG" ""
          post_log "Step 2 - 執行計劃 C1" "$STEP2_LOG" ""
          post_log "Step 3 - 品質保證" "$STEP3_LOG" ""
          post_log "Step 4 - 總結" "$STEP4_LOG" "summary:${ROUND_ID}"
          post_log "分析報告" "$REPORT_FILE" ""