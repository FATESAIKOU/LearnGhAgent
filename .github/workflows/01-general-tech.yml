name: 01-general-tech

# 觸發條件：
# 1. workflow_dispatch (input: pr_number) — 手動觸發
# 2. pull_request opened — PR 一建立就自動執行（與 create-pr 接力）
# 3. issue_comment on PR — user 在 PR 留言觸發接續工作
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to execute"
        required: true
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  execute:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_MODEL: ollama-cloud/${{ vars.OLLAMA_DEFAULT_MODEL || 'deepseek-v4-flash' }}
      PROJECT_DIR: projects/01-general-tech
      MAX_RETRY: "3"
      CHATLOG: ../../.github/scripts/chatlog.py
    defaults:
      run:
        working-directory: projects/01-general-tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install opencode
        working-directory: .
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 前置：一口氣判 PR number + skip 判定 + switch branch + build context + round id
      # ============================================================
      - name: Resolve PR number
        id: pr
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pr_number="${{ github.event.inputs.pr_number }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
          else
            pr_number="${{ github.event.issue.number }}"
          fi
          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"

      - name: Guard — check label, switch branch, build context, compute round
        id: guard
        run: |
          set -euo pipefail
          # 1. 檢查 PR 是否存在 + label 是否符合
          labels=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null || echo "")
          if ! echo "$labels" | grep -q '^project:01-general-tech$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR #$PR_NUMBER does not have project:01-general-tech label, skip"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # 2. switch to PR branch
          pr_branch=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName 2>/dev/null || echo "")
          if [[ -n "$pr_branch" ]]; then
            git fetch origin "$pr_branch"
            git checkout "$pr_branch"
          fi

          # 3. build conversation context + compute round id（chatlog.py 內部計算）
          mkdir -p memory/log output
          # 先存 gh JSON（避免跑兩次 gh pr view）
          gh pr view "$PR_NUMBER" --json body,comments > /tmp/pr_data.json
          # 跑 load-context-from-pr-log，stdout 含 round id 資訊
          python3 "$CHATLOG" /tmp/chatlog.json load-context-from-pr-log < /tmp/pr_data.json > /tmp/load_output.txt 2>&1
          cat /tmp/load_output.txt
          # 從 stdout 抓 round id
          round_line=$(grep -oE 'current round R[0-9]+' /tmp/load_output.txt | grep -oE 'R[0-9]+')
          echo "ROUND_ID=$round_line" >> "$GITHUB_ENV"
          echo "round_id=$round_line"

          # 4. 轉 prompt
          python3 "$CHATLOG" /tmp/chatlog.json toprompt > /tmp/conversation_context.txt

          # 5. prepare paths
          echo "STEP1_LOG=memory/log/${PR_NUMBER}_${round_line}_step1-intent.md" >> "$GITHUB_ENV"
          echo "STEP2_LOG=memory/log/${PR_NUMBER}_${round_line}_step2-plan_C1.md" >> "$GITHUB_ENV"
          echo "STEP3_LOG=memory/log/${PR_NUMBER}_${round_line}_step3-qa.md" >> "$GITHUB_ENV"
          echo "STEP4_LOG=memory/log/${PR_NUMBER}_${round_line}_step4-summary.md" >> "$GITHUB_ENV"
          echo "context built: $(wc -c < /tmp/conversation_context.txt) chars"

      - name: Stop if skip
        if: steps.guard.outputs.skip == 'true'
        run: echo "skipped due to label mismatch"

      # ============================================================
      # Step 1: 意圖理解
      # ============================================================
      - name: Step 1.1 - Build prompt
        if: steps.guard.outputs.skip != 'true'
        run: |
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 1：意圖理解。"
            echo "請依 know/AGENTS.md 中 Step 1 的規定，產出 ${STEP1_LOG}。"
            echo "這是「你自己的動作總結」。格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "注意：你要理解的是「這一輪（${ROUND_ID}）使用者的意圖」。若這是 R2+，使用者可能在追問、質疑或要求補充前幾輪的內容。"
            echo "直接把檔案內容寫到 ${STEP1_LOG}，不要額外輸出說明文字。"
          } > /tmp/step1_prompt.txt

      - name: Step 1.2 - Run opencode (with retry on hard validate)
        if: steps.guard.outputs.skip != 'true'
        env:
          STEP_NAME: step1-intent
          OUT_FILE: ${{ env.STEP1_LOG }}
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 1 attempt $attempt/$MAX_RETRY ---"
            rm -f "$OUT_FILE"
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step1_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            if ./validate.sh step-log-short "$OUT_FILE"; then
              echo "Step 1 hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 1 failed after $MAX_RETRY attempts"
          exit 1

      - name: Step 1.3 - Soft validate (LLM self-review)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 1 的軟性驗證。"
            echo "請讀取 judge/step1-intent.md 取得 review 觀點，再讀取 ${STEP1_LOG}，依觀點做評估。"
            echo "產出 judge/step1-intent-review.md，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）/ ## 問題點 / ## 建議"
            echo "直接把檔案內容寫到 judge/step1-intent-review.md。"
          } > /tmp/step1_review_prompt.txt
          opencode run --model "$OPENCODE_MODEL" --title "step1-review" "$(cat /tmp/step1_review_prompt.txt)" || echo "soft validate failed (optional), continue"

      # ============================================================
      # Step 2: 執行計劃 (C1)
      # ============================================================
      - name: Step 2.1 - Build prompt (C1)
        if: steps.guard.outputs.skip != 'true'
        run: |
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 2 的第一個 sub-step C1：取得 repo metadata 與主要文件。"
            echo "請依 do/skills/document/SKILL.md 的標準調研動作執行："
            echo "1. 若是 GitHub repo，用 gh api / gh repo view 取得 metadata"
            echo "2. 擷取 README.md 與關鍵子文件"
            echo "3. 補查背景脈絡"
            echo "若是 R2+，請針對這輪的意圖執行調研，而非重新做 R1 的事。"
            echo "產出 ${STEP2_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "直接把檔案內容寫到 ${STEP2_LOG}。"
          } > /tmp/step2_prompt.txt

      - name: Step 2.2 - Run opencode (with retry on hard validate)
        if: steps.guard.outputs.skip != 'true'
        env:
          STEP_NAME: step2-c1
          OUT_FILE: ${{ env.STEP2_LOG }}
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 2 attempt $attempt/$MAX_RETRY ---"
            rm -f "$OUT_FILE"
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step2_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            if ./validate.sh step-log-long "$OUT_FILE"; then
              echo "Step 2 hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 2 failed after $MAX_RETRY attempts"
          exit 1

      - name: Step 2.3 - Soft validate (LLM self-review)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 2 的軟性驗證。"
            echo "請讀取 judge/step2-plan.md 取得 review 觀點，再讀取 ${STEP2_LOG}，依觀點做評估。"
            echo "產出 judge/step2-plan-review.md，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）/ ## 問題點 / ## 建議"
            echo "直接把檔案內容寫到 judge/step2-plan-review.md。"
          } > /tmp/step2_review_prompt.txt
          opencode run --model "$OPENCODE_MODEL" --title "step2-review" "$(cat /tmp/step2_review_prompt.txt)" || echo "soft validate failed (optional), continue"

      # ============================================================
      # Step 3: 品質保證 (產報告 + 軟性驗證 + 硬性驗證)
      # ============================================================
      - name: Step 3.1 - Build prompt (report)
        if: steps.guard.outputs.skip != 'true'
        run: |
          current_round_num="${ROUND_ID#R}"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 3：基於調研資料，產出/更新最終分析報告。"
            if (( current_round_num == 1 )); then
              echo "這是 R1，請新建分析報告。檔名格式：output/${PR_NUMBER}_<技術名>.md"
              echo "（<技術名> 由你從調研標的自行判斷決定，用簡潔英文）"
              echo "報告必須含 4 個必要 section（首次產出無 ## 5. User Q&A）："
              echo "## 1. 這個技術解決什麼問題？ / ## 2. 這個問題為什麼會發生？（背景） / ## 3. 這個技術是如何解決該問題的？ / ## 4. 是否存在解決類似問題的其他技術 / 框架 / 思考方式？"
              echo "詳細格式見 know/AGENTS.md「分析報告格式」。直接把檔案內容寫到 output/ 目錄。"
            else
              echo "這是 ${ROUND_ID}（R2+），使用者正在追問前幾輪的內容。"
              echo "請讀取既有報告（output/ 目錄中 ${PR_NUMBER}_*.md 的檔案），把這一輪的 QA 沉澱進報告的 ## 5. User Q&A 章節："
              echo "- 將這一輪使用者提問構造化為 QA 條目，追加進 ## 5. User Q&A"
              echo "- 既有 QA 不可刪改，新 QA 按序號遞增接續"
              echo "- 若需補充 §1-§4 的內容也可更新，但不要刪除既有內容"
              echo "- 報告檔名保持不變（沿用 R1 的檔名）"
              echo "詳細格式見 know/AGENTS.md「分析報告格式」的 §5 規則。直接更新既有報告檔案。"
            fi
          } > /tmp/step3_report_prompt.txt

      - name: Step 3.2 - Run opencode for report (with retry on hard validate)
        if: steps.guard.outputs.skip != 'true'
        env:
          STEP_NAME: step3-report
        run: |
          set -euo pipefail
          current_round_num="${ROUND_ID#R}"
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 3 (report) attempt $attempt/$MAX_RETRY ---"
            if (( current_round_num == 1 )); then
              rm -f output/${PR_NUMBER}_*.md
            fi
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step3_report_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            report_file=$(ls output/${PR_NUMBER}_*.md 2>/dev/null | head -1)
            if [[ -z "$report_file" ]]; then
              echo "FAIL: no report file found matching output/${PR_NUMBER}_*.md" >&2
              continue
            fi
            echo "REPORT_FILE=$report_file" >> "$GITHUB_ENV"
            if ./validate.sh report "$report_file"; then
              echo "Step 3 report hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 3 report failed after $MAX_RETRY attempts"
          exit 1

      - name: Step 3.3 - Soft validate (LLM self-review)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 3 的軟性驗證。"
            echo "請讀取 judge/step3-qa.md 取得 review 觀點，再讀取報告 ${REPORT_FILE}，依觀點做評估。"
            echo "產出 ${STEP3_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "直接把檔案內容寫到 ${STEP3_LOG}。"
          } > /tmp/step3_review_prompt.txt
          opencode run --model "$OPENCODE_MODEL" --title "step3-qa" "$(cat /tmp/step3_review_prompt.txt)" || echo "soft validate failed (optional), continue"

      - name: Step 3.4 - Hard validate step log
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [[ -f "${STEP3_LOG}" ]]; then
            ./validate.sh step-log-medium "${STEP3_LOG}" || echo "step3 log validate failed (optional), continue"
          fi

      # ============================================================
      # Step 4: 總結
      # ============================================================
      - name: Step 4.1 - Build prompt (summary)
        if: steps.guard.outputs.skip != 'true'
        run: |
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 3 的 execution log ==="
            cat ${STEP3_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 3 log ==="
            echo ""
            echo "本輪產出的分析報告：${REPORT_FILE}"
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 4：總結本輪產出。"
            echo "產出 ${STEP4_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "直接把檔案內容寫到 ${STEP4_LOG}。"
          } > /tmp/step4_prompt.txt

      - name: Step 4.2 - Run opencode (with retry on hard validate)
        if: steps.guard.outputs.skip != 'true'
        env:
          STEP_NAME: step4-summary
          OUT_FILE: ${{ env.STEP4_LOG }}
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 4 attempt $attempt/$MAX_RETRY ---"
            rm -f "$OUT_FILE"
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step4_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            if ./validate.sh step-log-short "$OUT_FILE"; then
              echo "Step 4 hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 4 failed after $MAX_RETRY attempts"
          exit 1

      - name: Step 4.3 - Soft validate (LLM self-review)
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: |
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「技術解析助理」。現在執行 Step 4 的軟性驗證。"
            echo "請讀取 judge/step4-summary.md 取得 review 觀點，再讀取 ${STEP4_LOG}，依觀點做評估。"
            echo "產出 judge/step4-summary-review.md，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）/ ## 問題點 / ## 建議"
            echo "直接把檔案內容寫到 judge/step4-summary-review.md。"
          } > /tmp/step4_review_prompt.txt
          opencode run --model "$OPENCODE_MODEL" --title "step4-review" "$(cat /tmp/step4_review_prompt.txt)" || echo "soft validate failed (optional), continue"

      # ============================================================
      # Final: Commit + Post logs to PR chat
      # ============================================================
      - name: Commit & push
        if: steps.guard.outputs.skip != 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/01-general-tech/memory projects/01-general-tech/output
          git commit -m "tech-analysis: PR #${PR_NUMBER} ${ROUND_ID}" || echo "nothing to commit"
          git push

      - name: Post logs to PR chat (in order)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          post_log() {
            local label="$1"
            local file="$2"
            local tag="$3"
            if [[ ! -f "$file" ]]; then
              echo "skip: $file not found"
              return
            fi
            local content
            content="$(cat "$file")"
            local prefix=""
            if [[ -n "$tag" ]]; then
              prefix="<!-- chatlog:${tag} -->\n"
            fi
            local max=60000
            if (( ${#content} <= max )); then
              gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$content")"
            else
              local idx=1
              while (( ${#content} > 0 )); do
                local chunk="${content:0:$max}"
                content="${content:$max}"
                gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s part %d]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$idx" "$chunk")"
                idx=$((idx+1))
              done
            fi
          }
          post_log "Step 1 - 意圖理解" "$STEP1_LOG" ""
          post_log "Step 2 - 執行計劃 C1" "$STEP2_LOG" ""
          post_log "Step 3 - 品質保證" "$STEP3_LOG" ""
          post_log "Step 4 - 總結" "$STEP4_LOG" "summary:${ROUND_ID}"
          post_log "分析報告" "$REPORT_FILE" ""