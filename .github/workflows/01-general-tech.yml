name: 01-general-tech

# 觸發條件：
# 1. workflow_dispatch (input: pr_number) — 手動觸發
# 2. pull_request opened — PR 一建立就自動執行（與 create-pr 接力）
# 3. issue_comment on PR — user 在 PR 留言觸發接續工作
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to execute"
        required: true
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  execute:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_MODEL: ollama-cloud/${{ vars.OLLAMA_DEFAULT_MODEL || 'deepseek-v4-flash' }}
      PROJECT_DIR: projects/01-general-tech
      MAX_RETRY: "3"
    defaults:
      run:
        working-directory: projects/01-general-tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install opencode
        working-directory: .
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pr_number="${{ github.event.inputs.pr_number }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
          else
            pr_number="${{ github.event.issue.number }}"
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"

      - name: Switch to PR branch
        run: |
          set -euo pipefail
          pr_branch=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName 2>/dev/null || echo "")
          if [[ -z "$pr_branch" ]]; then
            echo "no PR found for #$PR_NUMBER, stay on main"
          else
            echo "switching to PR branch: $pr_branch"
            git fetch origin "$pr_branch"
            git checkout "$pr_branch"
          fi

      - name: Check PR has project label
        id: labelcheck
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name')
          if ! echo "$labels" | grep -q '^project:01-general-tech$'; then
            echo "PR #$PR_NUMBER does not have project:01-general-tech label, skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute round id
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # PR body 算 user 第 1 次發言 → 起始 user_count=1
          # 計算非 bot 的 comment 數量
          json=$(gh pr view "$PR_NUMBER" --json comments)
          user_count=1
          comment_count=$(echo "$json" | jq '.comments | length')
          for ((i=0; i<comment_count; i++)); do
            author=$(echo "$json" | jq -r ".comments[$i].author.login")
            if [[ "$author" == *"bot"* ]] || [[ "$author" == "github-actions[bot]" ]]; then
              continue
            fi
            user_count=$((user_count + 1))
          done
          echo "ROUND_ID=R${user_count}" >> "$GITHUB_ENV"
          echo "round_id=R${user_count}"

      - name: Prepare paths
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          mkdir -p memory/log output
          echo "STEP1_LOG=memory/log/${PR_NUMBER}_${ROUND_ID}_step1-intent.md" >> "$GITHUB_ENV"
          echo "STEP2_LOG=memory/log/${PR_NUMBER}_${ROUND_ID}_step2-plan_C1.md" >> "$GITHUB_ENV"
          echo "STEP3_LOG=memory/log/${PR_NUMBER}_${ROUND_ID}_step3-qa.md" >> "$GITHUB_ENV"
          echo "STEP4_LOG=memory/log/${PR_NUMBER}_${ROUND_ID}_step4-summary.md" >> "$GITHUB_ENV"

      - name: Stop if skip
        if: steps.labelcheck.outputs.skip == 'true'
        run: echo "skipped due to label mismatch"

      # ============================================================
      # Step 1: 意圖理解
      # ============================================================
      - name: Step 1.1 - Build prompt
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          pr_body=$(gh pr view "$PR_NUMBER" --json body -q .body)
          cat > /tmp/step1_prompt.txt <<EOF
          你是「技術解析助理」。現在執行 Step 1：意圖理解。

          使用者輸入（PR body，自由文字）：
          ---
          ${pr_body}
          ---

          請依 know/AGENTS.md 中 Step 1 的規定，產出 ${STEP1_LOG}。
          這是「你自己的動作總結」，不是 LLM 的詳細產出內容。格式必須是 4 個 section：
          ## 狀況理解
          ## 執行的動作與結果
          ## 動作結束後的現狀
          ## 其中的決斷點

          直接把檔案內容寫到 ${STEP1_LOG}，不要額外輸出說明文字。
          EOF

      - name: Step 1.2 - Run opencode (with retry on hard validate)
        if: steps.labelcheck.outputs.skip != 'true'
        env:
          STEP_NAME: step1-intent
          OUT_FILE: ${{ env.STEP1_LOG }}
          VALIDATE_TYPE: step-log-short
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 1 attempt $attempt/$MAX_RETRY ---"
            rm -f "$OUT_FILE"
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step1_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            if ./validate.sh "$VALIDATE_TYPE" "$OUT_FILE"; then
              echo "Step 1 hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 1 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Step 2: 執行計劃 (C1)
      # ============================================================
      - name: Step 2.1 - Build prompt (C1)
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          cat > /tmp/step2_prompt.txt <<EOF
          你是「技術解析助理」。現在執行 Step 2 的第一個 sub-step C1：取得 repo metadata 與主要文件。

          使用者輸入與你的意圖理解請參考 ${STEP1_LOG}（自行讀取）。
          請依 do/skills/document/SKILL.md 的標準調研動作執行：
          1. 若是 GitHub repo，用 gh api / gh repo view 取得 metadata
          2. 擷取 README.md 與關鍵子文件
          3. 補查背景脈絡

          產出 ${STEP2_LOG}。這是「你自己的動作總結」，不是詳細產出內容。格式必須是 4 個 section：
          ## 狀況理解
          ## 執行的動作與結果
          ## 動作結束後的現狀
          ## 其中的決斷點

          直接把檔案內容寫到 ${STEP2_LOG}。
          EOF

      - name: Step 2.2 - Run opencode (with retry on hard validate)
        if: steps.labelcheck.outputs.skip != 'true'
        env:
          STEP_NAME: step2-c1
          OUT_FILE: ${{ env.STEP2_LOG }}
          VALIDATE_TYPE: step-log-long
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 2 attempt $attempt/$MAX_RETRY ---"
            rm -f "$OUT_FILE"
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step2_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            if ./validate.sh "$VALIDATE_TYPE" "$OUT_FILE"; then
              echo "Step 2 hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 2 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Step 3: 品質保證 (產報告 + 軟性驗證 + 硬性驗證)
      # ============================================================
      - name: Step 3.1 - Build prompt (report)
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          cat > /tmp/step3_report_prompt.txt <<EOF
          你是「技術解析助理」。現在執行 Step 3：基於 Step 2 的調研資料，產出最終分析報告。

          參考 ${STEP2_LOG} 的調研資料與 ${STEP1_LOG} 的需求（自行讀取）。

          產出分析報告，檔名格式：output/${PR_NUMBER}_<技術名>.md
          （<技術名> 由你從調研標的自行判斷決定，用簡潔英文，例如 agent-skills、deepseek-v4）
          報告必須含 4 個必要 section：
          ## 1. 這個技術解決什麼問題？
          ## 2. 這個問題為什麼會發生？（背景）
          ## 3. 這個技術是如何解決該問題的？
          ## 4. 是否存在解決類似問題的其他技術 / 框架 / 思考方式？
          （首次產出無 ## 5. User Q&A）

          詳細格式見 know/AGENTS.md「分析報告格式」。直接把檔案內容寫到 output/ 目錄。
          EOF

      - name: Step 3.2 - Run opencode for report (with retry on hard validate)
        if: steps.labelcheck.outputs.skip != 'true'
        env:
          STEP_NAME: step3-report
          VALIDATE_TYPE: report
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 3 (report) attempt $attempt/$MAX_RETRY ---"
            # 清掉本 PR 的 report（避免 opencode 看到「已存在」不重寫）
            rm -f output/${PR_NUMBER}_*.md
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step3_report_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            # glob 抓實際產出的 report
            report_file=$(ls output/${PR_NUMBER}_*.md 2>/dev/null | head -1)
            if [[ -z "$report_file" ]]; then
              echo "FAIL: no report file found matching output/${PR_NUMBER}_*.md" >&2
              continue
            fi
            echo "REPORT_FILE=$report_file" >> "$GITHUB_ENV"
            if ./validate.sh "$VALIDATE_TYPE" "$report_file"; then
              echo "Step 3 report hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 3 report failed after $MAX_RETRY attempts"
          exit 1

      - name: Step 3.3 - Soft validate (LLM self-review, optional)
        if: steps.labelcheck.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          cat > /tmp/step3_review_prompt.txt <<EOF
          你是「技術解析助理」。現在執行 Step 3 的軟性驗證。

          請讀取 judge/step3-qa.md 取得 review 觀點，再讀取報告 ${REPORT_FILE}，依觀點做評估。

          產出 ${STEP3_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section：
          ## 狀況理解
          ## 執行的動作與結果
          ## 動作結束後的現狀
          ## 其中的決斷點

          直接把檔案內容寫到 ${STEP3_LOG}。
          EOF
          opencode run --model "$OPENCODE_MODEL" --title "step3-qa" "$(cat /tmp/step3_review_prompt.txt)" || echo "soft validate failed (optional), continue"

      - name: Step 3.4 - Hard validate step log
        if: steps.labelcheck.outputs.skip != 'true'
        env:
          OUT_FILE: ${{ env.STEP3_LOG }}
        run: |
          if [[ -f "$OUT_FILE" ]]; then
            ./validate.sh step-log-medium "$OUT_FILE" || echo "step3 log validate failed (optional), continue"
          fi

      # ============================================================
      # Step 4: 總結
      # ============================================================
      - name: Step 4.1 - Build prompt (summary)
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          cat > /tmp/step4_prompt.txt <<EOF
          你是「技術解析助理」。現在執行 Step 4：總結本輪產出。

          本輪產出：
          - 分析報告：${REPORT_FILE}
          - Step 1 log：${STEP1_LOG}
          - Step 2 log：${STEP2_LOG}
          - Step 3 log：${STEP3_LOG}

          產出 ${STEP4_LOG}。這是「你自己的動作總結」，格式必須是 4 個 section：
          ## 狀況理解
          ## 執行的動作與結果
          ## 動作結束後的現狀
          ## 其中的決斷點

          直接把檔案內容寫到 ${STEP4_LOG}。
          EOF

      - name: Step 4.2 - Run opencode (with retry on hard validate)
        if: steps.labelcheck.outputs.skip != 'true'
        env:
          STEP_NAME: step4-summary
          OUT_FILE: ${{ env.STEP4_LOG }}
          VALIDATE_TYPE: step-log-short
        run: |
          set -euo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "--- Step 4 attempt $attempt/$MAX_RETRY ---"
            rm -f "$OUT_FILE"
            opencode run --model "$OPENCODE_MODEL" --title "${STEP_NAME}-$attempt" "$(cat /tmp/step4_prompt.txt)" || {
              echo "opencode run failed, retry"
              continue
            }
            if ./validate.sh "$VALIDATE_TYPE" "$OUT_FILE"; then
              echo "Step 4 hard validate passed on attempt $attempt"
              exit 0
            fi
            echo "hard validate failed, retry"
          done
          echo "Step 4 failed after $MAX_RETRY attempts"
          exit 1

      # ============================================================
      # Final: Commit + Post logs to PR chat
      # ============================================================
      - name: Setup git bot identity
        if: steps.labelcheck.outputs.skip != 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & push
        if: steps.labelcheck.outputs.skip != 'true'
        working-directory: .
        run: |
          git add projects/01-general-tech/memory projects/01-general-tech/output
          git commit -m "tech-analysis: PR #${PR_NUMBER} ${ROUND_ID}" || echo "nothing to commit"
          git push

      - name: Post logs to PR chat (in order)
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          post_log() {
            local label="$1"
            local file="$2"
            if [[ ! -f "$file" ]]; then
              echo "skip: $file not found"
              return
            fi
            local content
            content="$(cat "$file")"
            # 分段（GitHub comment 約 65536 字元限制）
            local max=60000
            if (( ${#content} <= max )); then
              gh pr comment "$PR_NUMBER" --body "$(printf '### [%s]\n\n```markdown\n%s\n```\n' "$label" "$content")"
            else
              local idx=1
              while (( ${#content} > 0 )); do
                local chunk="${content:0:$max}"
                content="${content:$max}"
                gh pr comment "$PR_NUMBER" --body "$(printf '### [%s part %d]\n\n```markdown\n%s\n```\n' "$label" "$idx" "$chunk")"
                idx=$((idx+1))
              done
            fi
          }
          post_log "Step 1 - 意圖理解" "$STEP1_LOG"
          post_log "Step 2 - 執行計劃 C1" "$STEP2_LOG"
          post_log "Step 3 - 品質保證" "$STEP3_LOG"
          post_log "Step 4 - 總結" "$STEP4_LOG"
          post_log "分析報告" "$REPORT_FILE"

      - name: Post completion notice
        if: steps.labelcheck.outputs.skip != 'true'
        run: |
          gh pr comment "$PR_NUMBER" --body "✅ Round ${ROUND_ID} 完成。請 review 上方各 step log，決定 merge 或追問。"