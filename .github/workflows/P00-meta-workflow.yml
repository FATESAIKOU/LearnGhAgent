name: P00-meta-workflow

# 職責：接受 issue，建新 project（harness + workflow）
# 觸發：只接受 workflow_dispatch（由 W00-watch.yml 輪詢啟動）
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to execute"
        required: true
      max_retry:
        description: "Max retry attempts per step (1-5)"
        required: false
        default: "3"

concurrency:
  group: pr-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      pr_number: ${{ steps.guard.outputs.pr_number }}
    steps:
      - name: Guard
        id: guard
        run: |
          set -uo pipefail
          pr_number="${{ github.event.inputs.pr_number }}"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          # token check: 輕量 chat call，非 200 = 無用量或 token 無效
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST https://ollama.com/api/chat \
            -H "Authorization: Bearer ${{ secrets.OLLAMA_API_KEY }}" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4-flash","messages":[{"role":"user","content":"hi"}],"stream":false}' --max-time 30)
          if [[ "$http_code" != "200" ]]; then
            echo "FAIL: token check (HTTP $http_code)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # last message check: 合併 comments + reviews，取最後一則非 bot 的 author
          last_author=$(gh pr view "$pr_number" --json comments,reviews -q '
            ([.comments[]? | {author: .author.login, time: .createdAt}] +
             [.reviews[]? | select(.state == "COMMENTED") | {author: .author.login, time: .submittedAt}])
            | sort_by(.time) | last.author // empty
          ')
          if [[ -n "$last_author" ]] && [[ "$last_author" == *"bot"* || "$last_author" == "github-actions"* || "$last_author" == "app/"* || "$last_author" == *"[bot]"* ]]; then
            echo "FAIL: last message is bot ($last_author)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # label check: PR 必須帶有 project:P00-meta-workflow label
          if ! gh pr view "$pr_number" --json labels -q '.labels[].name' | grep -q '^project:P00-meta-workflow$'; then
            echo "FAIL: missing label"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  execute:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MYBRAIN_TOKEN: ${{ secrets.MYBRAIN_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENCODE_MODEL: ollama-cloud/${{ vars.OLLAMA_DEFAULT_MODEL || 'deepseek-v4-flash' }}
      OPENCODE_PERMISSION: '{"*":"allow"}'
      PROJECT_DIR: projects/P00-meta-workflow
      MAX_RETRY: ${{ github.event.inputs.max_retry || '3' }}
      CHATLOG: ../../.github/workflows/scripts/chatlog.py
      PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
    defaults:
      run:
        working-directory: projects/P00-meta-workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install opencode
        working-directory: .
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Setup MyBrain search
        working-directory: .
        env:
          MYBRAIN_TOKEN: ${{ secrets.MYBRAIN_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/opencode/skills ~/.config/opencode/commands
          cp -r .agents/skills/search-from-mybrain ~/.config/opencode/skills/
          cp .agents/commands/search-from-mybrain.md ~/.config/opencode/commands/
          GH_TOKEN="$MYBRAIN_TOKEN" MYBRAIN_DIR=/tmp/mybrain bash .agents/skills/search-from-mybrain/refresh.sh || true
          echo "MyBrain @ $(git -C /tmp/mybrain log -1 --format='%h %ad' --date=short 2>/dev/null || echo 'unavailable')"

      - name: Switch to PR branch + build context + round id + paths
        run: |
          set -uo pipefail
          pr_branch=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName 2>/dev/null || echo "")
          if [[ -n "$pr_branch" ]]; then
            git fetch origin "$pr_branch"
            git checkout "$pr_branch"
          fi
          # 確保 scripts 是最新版（PR branch 可能落後 main）
          git -C "$(git rev-parse --show-toplevel)" checkout origin/main -- .github/workflows/scripts/ 2>/dev/null || true
          mkdir -p memory/log output
          gh pr view "$PR_NUMBER" --json body,comments > /tmp/pr_data.json
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --jq '[.[] | {id, author: {login: .user.login}, body, state, submitted_at}]' > /tmp/reviews.json
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/comments" --jq '[.[] | {pull_request_review_id, user: {login: .user.login}, path, line, body, created_at}]' > /tmp/review_comments.json
          python3 ../../.github/workflows/scripts/merge_pr_data.py
          python3 "$CHATLOG" /tmp/chatlog.json load-context-from-pr-log < /tmp/pr_data.json > /tmp/load_output.txt 2>&1
          cat /tmp/load_output.txt
          round_line=$(grep -oE 'current round R[0-9]+' /tmp/load_output.txt | grep -oE 'R[0-9]+')
          echo "ROUND_ID=$round_line" >> "$GITHUB_ENV"
          python3 "$CHATLOG" /tmp/chatlog.json toprompt > /tmp/conversation_context.txt
          PROJECT_ROOT="$(git rev-parse --show-toplevel)/projects/P00-meta-workflow"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "STEP1_LOG=${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${round_line}_step1-intent.md" >> "$GITHUB_ENV"
          echo "STEP2_LOG=${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${round_line}_step2-plan_C1.md" >> "$GITHUB_ENV"
          echo "STEP3_LOG=${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${round_line}_step3-qa.md" >> "$GITHUB_ENV"
          echo "STEP4_LOG=${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${round_line}_step4-summary.md" >> "$GITHUB_ENV"
          echo "context built: $(wc -c < /tmp/conversation_context.txt) chars, round=$round_line"

      # Step 1: 意圖理解 — 從 issue 內容解析要建什麼 project
      - name: Step 1 - Build prompt
        run: |
          REVIEW_FILE="${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${ROUND_ID}_review_step1.md"
          echo "STEP1_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 1：意圖理解。"
            echo "使用者要建立一個新 project。請從 PR body 中解析："
            echo "- project_name（簡潔英文資料夾名，格式 P<編號>-<名稱>，如 P02-news-catchup）"
            echo "- project_description（一句話描述）"
            echo "- project_role（agent 角色描述）"
            echo "產出 ${STEP1_LOG}。格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "檔案長度上限：2000 字。超過會被硬性驗證拒絕，請精簡。"
            echo "直接把檔案內容寫到 ${STEP1_LOG}，不要額外輸出說明文字。"
          } > /tmp/step1_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 1 的軟性驗證。"
            echo "請讀取 judge/step1-intent.md 取得 review 觀點，再讀取 ${STEP1_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step1_review_prompt.txt

      - name: Step 1 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 1 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP1_LOG}" "${STEP1_REVIEW}"
            opencode run --model "$OPENCODE_MODEL" --title "step1-$attempt" "$(cat /tmp/step1_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"
            echo "::group::Step 1 - Hard validate"
            ./judge/validate-step1.sh "${STEP1_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed, retry"
              continue
            fi
            echo "::group::Step 1 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step1-review-$attempt" "$(cat /tmp/step1_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP1_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi
            echo "Step 1 passed on attempt $attempt"
            exit 0
          done
          echo "Step 1 failed after $MAX_RETRY attempts"
          exit 1

      # Step 2: 執行計劃 — 生成 project 檔案
      - name: Step 2 - Build prompt
        run: |
          REVIEW_FILE="${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${ROUND_ID}_review_step2.md"
          echo "STEP2_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 2：根據 Step 1 的意圖理解，生成新 project 的檔案。"
            echo "請在 ../../projects/ 目錄下建立新 project 資料夾（名稱從 Step 1 解析），包含："
            echo "1. know/AGENTS.md — project 的 agent 角色定義 + 4 step 執行流程（參考 ../../projects/P01-general-tech/know/AGENTS.md 的格式）"
            echo "2. know/我.md — 使用者 persona（可從 ../../projects/P01-general-tech/know/我.md 複製）"
            echo "3. opencode.json — LLM 設定（可從 ../../projects/P01-general-tech/opencode.json 複製，改 instructions 路徑）"
            echo "4. judge/validate-step1.sh ~ validate-step4.sh — 硬性驗證腳本（從 ../../projects/P01-general-tech/judge/ 複製）"
            echo "5. judge/ — review 觀點（step1-intent.md ~ step4-summary.md，根據 project 特性調整）"
            echo "6. memory/log/.gitkeep, output/.gitkeep, guardrail/.gitkeep"
            echo "7. do/skills/ — 根據 project 需求建立 skill"
            echo "同時在 ../../.github/workflows/ 建立 <project_name>.yml（從 ../../.github/workflows/P01-general-tech.yml 複製，改 name + label + PROJECT_DIR。CHATLOG 路徑已統一為 ../../.github/workflows/scripts/chatlog.py，不需修改）。"
            echo "產出 ${STEP2_LOG}。格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "檔案長度上限：6000 字。超過會被硬性驗證拒絕，請精簡。"
            echo "直接把檔案內容寫到 ${STEP2_LOG}。"
          } > /tmp/step2_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 2 的軟性驗證。"
            echo "請讀取 judge/step2-plan.md 取得 review 觀點，再讀取 ${STEP2_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step2_review_prompt.txt

      - name: Step 2 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 2 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP2_LOG}" "${STEP2_REVIEW}"
            opencode run --model "$OPENCODE_MODEL" --title "step2-$attempt" "$(cat /tmp/step2_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"
            echo "::group::Step 2 - Hard validate"
            ./judge/validate-step2.sh "${STEP2_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed, retry"
              continue
            fi
            echo "::group::Step 2 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step2-review-$attempt" "$(cat /tmp/step2_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP2_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi
            echo "Step 2 passed on attempt $attempt"
            exit 0
          done
          echo "Step 2 failed after $MAX_RETRY attempts"
          exit 1

      # Step 3: 品質保證 — 驗證產出的檔案
      - name: Step 3 - Build prompt
        run: |
          REVIEW_FILE="${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${ROUND_ID}_review_step3.md"
          echo "STEP3_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          current_round_num="${ROUND_ID#R}"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 3：驗證 Step 2 產出的 project 檔案是否完整且正確。"
            echo "檢查項目："
            echo "1. projects/ 下有新建的 project 資料夾"
            echo "2. know/AGENTS.md 存在且含 4 step 流程定義"
            echo "3. .github/workflows/ 下有對應的 <project_name>.yml"
            echo "4. opencode.json + judge/validate-step*.sh 存在"
            echo "5. judge/ 有 4 個 review 觀點檔"
            echo "產出 ${STEP3_LOG}。格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "execution log 長度上限：3000 字。超過會被硬性驗證拒絕，請精簡。"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${STEP3_LOG}。"
          } > /tmp/step3_main_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 3 的軟性驗證。"
            echo "請讀取 judge/step3-qa.md 取得 review 觀點，再讀取 ${STEP3_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step3_review_prompt.txt

      - name: Step 3 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 3 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP3_LOG}" "${STEP3_REVIEW}"
            opencode run --model "$OPENCODE_MODEL" --title "step3-$attempt" "$(cat /tmp/step3_main_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"
            echo "::group::Step 3 - Hard validate (step log)"
            ./judge/validate-step3.sh "${STEP3_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed (step log), retry"
              continue
            fi
            echo "::group::Step 3 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step3-review-$attempt" "$(cat /tmp/step3_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP3_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi
            echo "Step 3 passed on attempt $attempt"
            exit 0
          done
          echo "Step 3 failed after $MAX_RETRY attempts"
          exit 1

      # Step 4: 總結
      - name: Step 4 - Build prompt
        run: |
          REVIEW_FILE="${PROJECT_ROOT}/memory/log/${PR_NUMBER}_${ROUND_ID}_review_step4.md"
          echo "STEP4_REVIEW=$REVIEW_FILE" >> "$GITHUB_ENV"
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 1 的 execution log ==="
            cat ${STEP1_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 1 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 2 的 execution log ==="
            cat ${STEP2_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 2 log ==="
            echo ""
            echo "=== 這一輪（${ROUND_ID}）Step 3 的 execution log ==="
            cat ${STEP3_LOG} 2>/dev/null || echo "(尚未產出)"
            echo "=== End of Step 3 log ==="
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 4：總結本輪產出。"
            echo "產出 ${STEP4_LOG}。格式必須是 4 個 section："
            echo "## 狀況理解 / ## 執行的動作與結果 / ## 動作結束後的現狀 / ## 其中的決斷點"
            echo "在「動作結束後的現狀」中必須包含：新建的 project 名稱與檔案清單。"
            echo "在「其中的決斷點」中必須包含「待追問方向」段落（若無則寫「無」）。"
            echo "檔案長度上限：2000 字。超過會被硬性驗證拒絕，請精簡。"
            echo "直接把檔案內容寫到 ${STEP4_LOG}。"
          } > /tmp/step4_prompt.txt
          {
            python3 "$CHATLOG" /tmp/chatlog.json toprompt
            echo ""
            echo "=== 本次任務 ==="
            echo "你是「Meta Workflow 助理」。現在執行 Step 4 的軟性驗證。"
            echo "請讀取 judge/step4-summary.md 取得 review 觀點，再讀取 ${STEP4_LOG}，依觀點做評估。"
            echo "產出 ${REVIEW_FILE}，格式："
            echo "## 驗證項目（表格：項目 | 結果 | 備註）"
            echo "## 問題點（若無則寫「無」）"
            echo "## 建議（若無則寫「無」）"
            echo "最後一行必須是 VERDICT: PASS 或 VERDICT: FAIL"
            echo "直接把檔案內容寫到 ${REVIEW_FILE}。"
          } > /tmp/step4_review_prompt.txt

      - name: Step 4 - Execute (opencode + hard validate + soft validate)
        run: |
          set -uo pipefail
          attempt=0
          while (( attempt < MAX_RETRY )); do
            attempt=$((attempt+1))
            echo "::group::Step 4 - 執行 opencode (attempt $attempt/$MAX_RETRY)"
            rm -f "${STEP4_LOG}" "${STEP4_REVIEW}"
            opencode run --model "$OPENCODE_MODEL" --title "step4-$attempt" "$(cat /tmp/step4_prompt.txt)" || echo "opencode run failed (will validate)"
            echo "::endgroup::"
            echo "::group::Step 4 - Hard validate"
            ./judge/validate-step4.sh "${STEP4_LOG}"
            hard_rc=$?
            echo "::endgroup::"
            if [[ $hard_rc -ne 0 ]]; then
              echo "hard validate failed, retry"
              continue
            fi
            echo "::group::Step 4 - Soft validate (opencode review)"
            opencode run --model "$OPENCODE_MODEL" --title "step4-review-$attempt" "$(cat /tmp/step4_review_prompt.txt)" || echo "review run failed"
            echo "::endgroup::"
            if ! grep -q "VERDICT: PASS" "${STEP4_REVIEW}" 2>/dev/null; then
              echo "soft validate FAIL, retry"
              continue
            fi
            echo "Step 4 passed on attempt $attempt"
            exit 0
          done
          echo "Step 4 failed after $MAX_RETRY attempts"
          exit 1

      # Final: Commit + Post logs
      - name: Commit & push
        working-directory: .
        env:
          LEARNGHAGENT_TOKEN: ${{ secrets.LEARNGHAGENT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/
          git commit -m "meta-workflow: PR #${PR_NUMBER} ${ROUND_ID}" || echo "nothing to commit"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || echo "pull rebase skipped"
          git push "https://x-access-token:${LEARNGHAGENT_TOKEN}@github.com/${{ github.repository }}" HEAD
          # workflow 檔案用 gh api + LEARNGHAGENT_TOKEN 推送（GITHUB_TOKEN App token 無法 push workflow 檔案）
          export GH_TOKEN="$LEARNGHAGENT_TOKEN"
          for wf in .github/workflows/P*.yml; do
            [[ -f "$wf" ]] || continue
            content=$(base64 -w0 "$wf")
            sha=$(gh api "repos/${{ github.repository }}/contents/$wf?ref=$(git rev-parse --abbrev-ref HEAD)" --jq '.sha // empty' 2>/dev/null || echo "")
            if [[ -n "$sha" ]]; then
              gh api -X PUT "repos/${{ github.repository }}/contents/$wf" \
                -f message="meta-workflow: update $wf" \
                -f content="$content" \
                -f sha="$sha" \
                -f branch="$(git rev-parse --abbrev-ref HEAD)"
            else
              gh api -X PUT "repos/${{ github.repository }}/contents/$wf" \
                -f message="meta-workflow: create $wf" \
                -f content="$content" \
                -f branch="$(git rev-parse --abbrev-ref HEAD)"
            fi
          done

      - name: Post logs to PR chat (in order)
        run: |
          set -uo pipefail
          post_log() {
            local label="$1"
            local file="$2"
            local tag="$3"
            if [[ ! -f "$file" ]]; then echo "skip: $file not found"; return; fi
            local content
            content="$(cat "$file")"
            local prefix=""
            if [[ -n "$tag" ]]; then prefix="<!-- chatlog:${tag} -->\n"; fi
            local max=60000
            if (( ${#content} <= max )); then
              gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$content")"
            else
              local idx=1
              while (( ${#content} > 0 )); do
                local chunk="${content:0:$max}"
                content="${content:$max}"
                gh pr comment "$PR_NUMBER" --body "$(printf "${prefix}### [%s part %d]\n\n\`\`\`markdown\n%s\n\`\`\`\n" "$label" "$idx" "$chunk")"
                idx=$((idx+1))
              done
            fi
          }
          post_log "Step 1 - 意圖理解" "${STEP1_LOG}" ""
          post_log "Step 2 - 執行計劃 C1" "${STEP2_LOG}" ""
          post_log "Step 3 - 品質保證" "${STEP3_LOG}" ""
          post_log "Step 4 - 總結" "${STEP4_LOG}" "summary:${ROUND_ID}"