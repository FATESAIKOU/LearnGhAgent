name: 00-watch

# 觸發：每小時定時 + 手動
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: 00-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.LEARNGHAGENT_TOKEN }}
      # 軟判定（sync 意圖分類）用。判斷「這則留言有沒有 sync-to-mybrain 意圖」。
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      CLASSIFIER_MODEL: ${{ vars.OLLAMA_DEFAULT_MODEL || 'deepseek-v4-flash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # ============================================================
      # Phase 1: 掃所有 open issue，對沒有 PR 的 issue 建 PR
      # ============================================================
      - name: Create PRs for issues without PR
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 取所有 open issue（帶 label）
          issues=$(gh issue list --repo "$GH_REPO" --state open --json number,title,body,labels --limit 100)

          # 取所有 open PR 的 head branch 名（用來判重複）
          existing_branches=$(gh pr list --repo "$GH_REPO" --state open --json headRefName -q '.[].headRefName')

          echo "$issues" | jq -c '.[]' | while read -r issue; do
            number=$(echo "$issue" | jq -r .number)
            title=$(echo "$issue" | jq -r .title)
            body=$(echo "$issue" | jq -r .body)

            # 從 label 抓 project name
            project=$(echo "$issue" | jq -r '.labels[].name' | grep -E '^project:' | head -1 | sed 's/^project://')
            if [[ -z "$project" ]]; then
              continue
            fi

            # 對應 branch 名 = project_issueNumber
            branch="${project}_${number}"

            # 已有 open PR 用這個 branch 就跳過
            if echo "$existing_branches" | grep -qx "$branch"; then
              continue
            fi

            # 建 branch + empty commit + push
            git checkout -B "$branch"
            git commit --allow-empty -m "Initialize PR for issue #$number"
            git push origin "$branch" --force

            # 建 PR，body = issue 內容 + Closes 關鍵字（merge 時自動關閉原 issue）
            pr_body=$(printf '## Original Issue: #%s\n\n%s\n\nCloses #%s' "$number" "$body" "$number")
            gh pr create --base main --head "$branch" \
              --title "[${project}] ${title}" \
              --body "$pr_body" \
              --label "project:${project}" \
              --label "agent-exec" 2>/dev/null || echo "PR create failed for issue #$number (may already exist)"
            echo "Created PR for issue #$number (project: $project)"

            # 切回 main 供下一個 issue 用
            git checkout main
          done

      # ============================================================
      # Phase 2: 掃所有 open PR，啟動需要執行的 project workflow
      # ============================================================
      - name: Poll PRs and launch project workflows
        run: |
          set -uo pipefail

          # 判定 bot author
          is_bot() {
            local login="$1"
            [[ "$login" == *"bot"* || "$login" == "github-actions"* || "$login" == "app/"* || "$login" == *"[bot]"* ]]
          }

          # 判定使用者這則留言要的是「做事」還是「存進第二大腦」。
          #
          # 硬 trigger：留言以 /sync-to-mybrain 開頭（可帶參數，如
          # 「/sync-to-mybrain 存進技術評估」）才算 SYNC。其餘一律 TASK——
          # 誤判成 TASK 只是多跑一輪調研，誤判成 SYNC 會把還沒定稿的東西
          # 寫進第二大腦，代價不對稱。
          classify_intent() {
            local body="$1"
            [[ -z "$body" ]] && { echo "TASK"; return; }
            if printf '%s' "$body" | grep -qiE '^[[:space:]]*/sync[-_ ]?to[-_ ]?my[-_ ]?brain'; then
              echo "SYNC"; return
            fi
            echo "TASK"
          }

          # 軟判定：留言有 sync-to-mybrain 意圖但非正確格式（沒以 /sync-to-mybrain
          # 開頭）。命中就直接回文提醒使用者照格式回文，不啟動任何 workflow——
          # 回文後最後留言變 bot，下次掃描自動 skip，不會重複提醒。
          # LLM 掛掉、回空、回垃圾都走這裡 → 回 TASK（維持既有行為，不阻塞）。
          detect_sync_intent() {
            local body="$1"
            [[ -z "$body" ]] && { echo "TASK"; return; }
            local payload resp
            payload=$(jq -n --arg m "$CLASSIFIER_MODEL" --arg c "$body" '{
              model: $m, stream: false,
              messages: [
                {role: "system", content: "你是意圖分類器。使用者在一個技術調研 PR 底下留言。判斷這則留言是否在要求把這次的成果存進他的第二大腦（MyBrain / 第二大腦 / 知識庫）。是就輸出 SYNC，否則輸出 TASK。追問技術問題、質疑結論、要求補充或修改報告，全部都是 TASK。只輸出一個詞，不要解釋。"},
                {role: "user", content: $c}
              ]}')
            resp=$(curl -sS -X POST https://ollama.com/api/chat \
              -H "Authorization: Bearer ${OLLAMA_API_KEY}" \
              -H "Content-Type: application/json" \
              --max-time 60 -d "$payload" 2>/dev/null | jq -r '.message.content // empty')
            if printf '%s' "$resp" | grep -q 'SYNC'; then echo "SYNC"; else echo "TASK"; fi
          }

          # 取所有 open PR
          prs=$(gh pr list --repo "$GH_REPO" --state open --json number,labels --limit 50)

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            pr_number=$(echo "$pr" | jq -r .number)

            # 從 label 抓 project name
            project=$(echo "$pr" | jq -r '.labels[].name' | grep -E '^project:' | head -1 | sed 's/^project://')
            if [[ -z "$project" ]]; then
              continue
            fi

            # 判定：合併 comments + reviews 按時間排序，取最後一則非 bot 的
            # gh pr list 不包含 reviews，改用 gh pr view
            # body 一起取——要拿它判意圖，不能只看 author
            last_msg=$(gh pr view "$pr_number" --json comments,reviews -q '
              ([.comments[]? | {author: .author.login, time: .createdAt, body: .body}] +
               [.reviews[]? | select(.state == "COMMENTED") | {author: .author.login, time: .submittedAt, body: .body}])
              | sort_by(.time) | last // empty
            ')
            last_author=$(printf '%s' "$last_msg" | jq -r '.author // empty')
            last_body=$(printf '%s' "$last_msg" | jq -r '.body // empty')
            if [[ -n "$last_author" ]] && is_bot "$last_author"; then
              echo "PR #$pr_number: last message is bot, skip"
              continue
            fi

            # 三層意圖分流：
            # 1. 硬 trigger（/sync-to-mybrain 開頭）→ 啟動 PCM 同步第二大腦
            # 2. 軟判定（LLM 偵測到 sync 意圖但非正確格式）→ 直接回文提醒，
            #    不啟動任何 workflow
            # 3. 其餘 → 啟動該 project 的 pipeline
            # 三者共用 concurrency group pr-<n>，不會同時跑。
            intent=$(classify_intent "$last_body")
            if [[ "$intent" == "SYNC" ]]; then
              echo "PR #$pr_number: intent=SYNC, launching PCM-sync-to-mybrain.yml"
              gh workflow run "PCM-sync-to-mybrain.yml" --ref main -f pr_number="$pr_number" \
                || echo "Failed to launch PCM-sync-to-mybrain.yml for PR #$pr_number"
              continue
            fi

            soft=$(detect_sync_intent "$last_body")
            if [[ "$soft" == "SYNC" ]]; then
              echo "PR #$pr_number: soft intent=SYNC, posting format hint"
              gh pr comment "$pr_number" --body "<!-- chatlog:sync-hint -->偵測到你想把這輪的成果存進第二大腦。請用正確格式回文觸發同步：\`/sync-to-mybrain\`（可帶參數指定存什麼，例如 \`/sync-to-mybrain 存進技術評估，判定寫...\`）。" \
                || echo "Failed to post sync hint for PR #$pr_number"
              continue
            fi

            # 啟動（project workflow 有 concurrency per PR，重複觸發會被 GitHub 擋掉）
            echo "PR #$pr_number: intent=TASK, launching ${project}.yml"
            gh workflow run "${project}.yml" --ref main -f pr_number="$pr_number" \
              || echo "Failed to launch ${project}.yml for PR #$pr_number"
          done

          echo "Poll complete"
          exit 0